<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Հատուկ Հրավեր | Special Invitation</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-bg: #0b0b0b;
            --card-bg: rgba(20, 20, 20, 0.85);
            --text-color: #f4f4f4;
            --accent-color: #e6c567;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80'); /* Այստեղ կարող եք փոխել ձեր ֆոնի նկարը */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Language Switcher */
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 5px 12px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            transition: 0.3s;
            border-radius: 4px;
        }

        .lang-btn.active, .lang-btn:hover {
            background: var(--primary-gold);
            color: var(--dark-bg);
        }

        /* Main Container */
        .container {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            margin-top: 50px;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--primary-gold);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 30px;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #ddd;
        }

        /* Countdown Timer */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--primary-gold);
            padding: 15px;
            border-radius: 8px;
            min-width: 80px;
        }

        .time-box span {
            display: block;
            font-size: 1.8rem;
            font-family: 'Playfair Display', serif;
            color: var(--primary-gold);
            font-weight: bold;
        }

        .time-box label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #aaa;
        }

        /* Media Section (Images & Video) */
        .media-container {
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .media-container img, .media-container video {
            width: 100%;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            max-height: 400px;
            object-fit: cover;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            background: var(--primary-gold);
            color: var(--dark-bg);
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            font-size: 1rem;
        }

        .btn:hover {
            background: #fff;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        /* Music Player Widget */
        .music-widget {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .music-widget button {
            background: none;
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .music-widget button:hover {
            background: var(--primary-gold);
            color: var(--dark-bg);
        }

        @media(max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .container { padding: 20px; }
            .countdown { gap: 10px; }
            .time-box { min-width: 65px; padding: 10px; }
        }
    </style>
</head>
<body>

    <!-- Լեզուների ընտրություն -->
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLanguage('hy')">HY</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" onclick="setLanguage('ru')">RU</button>
    </div>

    <div class="container">
        <h1 id="title">Աննա & Արման</h1>
        <div class="subtitle" id="subtitle">Հարսանեկան Հրավիրատոմս</div>
        
        <p id="invitation-text">
            Սիրով հրավիրում ենք ձեզ կիսելու մեզ հետ մեր կյանքի ամենակարևոր և երջանիկ պահերից մեկը՝ մեր հարսանեկան արարողությունը։
        </p>

        <!-- Հետհաշվարկ -->
        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <label id="lbl-days">Օր</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label id="lbl-hours">Ժամ</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label id="lbl-mins">Րոպե</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label id="lbl-secs">Վայրկյան</label>
            </div>
        </div>

        <!-- Նկարների և Վիդեոների բաժին (հեշտությամբ փոխարինելի են) -->
        <div class="media-container">
            <!-- Կարող եք տեղադրել ձեր նկարի հղումը src ատրիբուտում -->
            <img src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=1000&q=80" alt="Couple Photo">
            
            <!-- Վիդեո բաժին (եթե անհրաժեշտ չէ, կարող եք ջնջել այս տողը) -->
            <!-- <video controls src="your-video.mp4"></video> -->
        </div>

        <!-- Գործողությունների կոճակներ -->
        <div class="btn-group">
            <a href="https://maps.app.goo.gl/XXXXX" target="_blank" class="btn" id="btn-map">Քարտեզ / Map</a>
            <a href="https://wa.me/374XXXXXXXX" target="_blank" class="btn" id="btn-rsvp">Հաստատել (RSVP)</a>
        </div>

        <!-- Երաժշտական նվագարկիչ (Շառլ Ազնավուր - She) -->
        <div class="music-widget">
            <button id="play-music-btn" onclick="toggleMusic()">▶</button>
            <span id="music-label">Charles Aznavour - She</span>
        </div>
    </div>

    <!-- Աուդիո ֆայլ (Շառլ Ազնավուր - She ուղիղ հղումով) -->
    <audio id="bg-music" loop>
        <source src="https://cdns.hotplayer.ru/dl/1e91244e05b5aa705970ee1c79e7be94/Charles+Aznavour+-+She+(hotplayer.ru).mp3" type="audio/mp3">
    </audio>

    <script>
        /* --- Լեզուների բառարան --- */
        const translations = {
            hy: {
                title: "Աննա & Արման",
                subtitle: "Հարսանեկան Հրավիրատոմս",
                text: "Սիրով հրավիրում ենք ձեզ կիսելու մեզ հետ մեր կյանքի ամենակարևոր և երջանիկ պահերից մեկը՝ մեր հարսանեկան արարողությունը։",
                days: "Օր", hours: "Ժամ", mins: "Րոպե", secs: "Վայրկյան",
                map: "Քարտեզ", rsvp: "Հաստատել (RSVP)"
            },
            en: {
                title: "Anna & Arman",
                subtitle: "Wedding Invitation",
                text: "We cordially invite you to share with us one of the most important and happy moments of our lives — our wedding ceremony.",
                days: "Days", hours: "Hours", mins: "Mins", secs: "Secs",
                map: "Location Map", rsvp: "RSVP Confirm"
            },
            ru: {
                title: "Анна & Арман",
                subtitle: "Свадебное Приглашение",
                text: "Мы сердечно приглашаем вас разделить с нами один из самых важных и счастливых моментов нашей жизни — день нашей свадьбы.",
                days: "Дней", hours: "Часов", mins: "Минут", secs: "Секунд",
                map: "Карта проезда", rsvp: "Подтвердить (RSVP)"
            }
        };

        function setLanguage(lang) {
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('title').innerText = translations[lang].title;
            document.getElementById('subtitle').innerText = translations[lang].subtitle;
            document.getElementById('invitation-text').innerText = translations[lang].text;
            document.getElementById('lbl-days').innerText = translations[lang].days;
            document.getElementById('lbl-hours').innerText = translations[lang].hours;
            document.getElementById('lbl-mins').innerText = translations[lang].mins;
            document.getElementById('lbl-secs').innerText = translations[lang].secs;
            document.getElementById('btn-map').innerText = translations[lang].map;
            document.getElementById('btn-rsvp').innerText = translations[lang].rsvp;
        }

        /* --- Հետհաշվարկի ժամացույց (Նշեք ձեր միջոցառման ամսաթիվը) --- */
        const eventDate = new Date("October 25, 2026 17:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const gap = eventDate - now;

            if (gap < 0) return;

            const second = 1000;
            const minute = second * 60;
            const hour = minute * 60;
            const day = hour * 24;

            document.getElementById("days").innerText = Math.floor(gap / day);
            document.getElementById("hours").innerText = Math.floor((gap % day) / hour);
            document.getElementById("minutes").innerText = Math.floor((gap % hour) / minute);
            document.getElementById("seconds").innerText = Math.floor((gap % minute) / second);
        }
        setInterval(updateCountdown, 1000);

        /* --- Երաժշտական նվագարկիչ --- */
        const music = document.getElementById("bg-music");
        const playBtn = document.getElementById("play-music-btn");
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                playBtn.innerText = "▶";
                isPlaying = false;
            } else {
                music.play().then(() => {
                    playBtn.innerText = "❚❚";
                    isPlaying = true;
                }).catch(e => {
                    console.log("Audio play blocked by browser policy");
                });
            }
        }
    </script>
</body>
</html>
