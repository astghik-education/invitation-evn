<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ===============================
         Basic Meta
    ================================ -->

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ===============================
         SEO
    ================================ -->

    <title>Luxury Birthday Invitation</title>

    <meta name="description"
        content="Luxury animated birthday invitation with countdown, gallery, music, RSVP, fireworks and premium design.">

    <meta name="keywords"
        content="Birthday Invitation, Luxury Invitation, Invitation, Birthday">

    <meta name="author"
        content="Luxury Invitation">

    <meta name="theme-color"
        content="#D4AF37">

    <!-- ===============================
         Fonts
    ================================ -->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- ===============================
         CSS
    ================================ -->

    <link rel="stylesheet" href="css/reset.css">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/animations.css">

</head>

<body>

    <!-- ===========================================
         Sparkles
    ============================================ -->

    <div id="sparkles"></div>

    <!-- ===========================================
         Balloons
    ============================================ -->

    <div id="balloons"></div>

    <!-- ===========================================
         Fireworks
    ============================================ -->

    <canvas id="fireworks"></canvas>

    <!-- ===========================================
         Confetti
    ============================================ -->

    <canvas id="confetti"></canvas>

    <!-- ===========================================
         Music
    ============================================ -->

    <audio id="backgroundMusic" loop>

        <source
            src="assets/music/background.mp3"
            type="audio/mpeg">

    </audio>

    <!-- ===========================================
         Main
    ============================================ -->

    <main>

        <!-- Hero -->

        <section id="hero">

            <div class="glass-card">

                <p id="heroGreeting">

                    You're Invited

                </p>

                <h1 id="heroTitle">

                    Luxury Birthday Celebration

                </h1>

                <p id="heroSubtitle">

                    Join us for an unforgettable evening.

                </p>

                <a href="#countdown"
                    class="primary-button">

                    View Invitation

                </a>

            </div>

        </section>

        <!-- Countdown -->

        <section id="countdown">

            <div class="section-container">

                <h2>

                    Countdown

                </h2>

                <div id="countdownTimer">

                </div>

            </div>

        </section>

        <!-- Event -->

        <section id="details">

            <div class="section-container">

                <h2>

                    Event Details

                </h2>

                <div id="eventInfo">

                </div>

                <button
                    id="mapButton"
                    class="primary-button">

                    Open Google Maps

                </button>

            </div>

        </section>

        <!-- Gallery -->

        <section id="gallery">

            <div class="section-container">

                <h2>

                    Gallery

                </h2>

                <div id="galleryGrid">

                </div>

            </div>

        </section>

        <!-- RSVP -->

        <section id="rsvp">

            <div class="section-container">

                <h2>

                    RSVP

                </h2>

                <form id="rsvpForm">

                    <input
                        type="text"
                        id="guestName"
                        placeholder="Your Name"
                        required>

                    <input
                        type="number"
                        id="guestCount"
                        placeholder="Guests">

                    <textarea
                        id="guestMessage"
                        placeholder="Message"></textarea>

                    <button
                        type="submit"
                        class="primary-button">

                        Confirm Attendance

                    </button>

                </form>

            </div>

        </section>

    </main>

    <!-- ===========================================
         Footer
    ============================================ -->

    <footer>

        <p>

            Made with ❤️

        </p>

    </footer>

    <!-- ===========================================
         Floating Buttons
    ============================================ -->

    <div id="floatingControls">

        <button id="musicToggle">

            ♪

        </button>

        <button id="languageToggle">

            EN

        </button>

        <button id="themeToggle">

            ☾

        </button>

    </div>

    <!-- ===========================================
         JavaScript
    ============================================ -->

    <script src="js/config.js"></script>

    <script src="js/main.js"></script>

    <script src="js/countdown.js"></script>

    <script src="js/gallery.js"></script>

    <script src="js/music.js"></script>

    <script src="js/fireworks.js"></script>

    <script src="js/confetti.js"></script>

    <script src="js/balloons.js"></script>

    <script src="js/sparkles.js"></script>

    <script src="js/rsvp.js"></script>

    <script src="js/theme.js"></script>

    <script src="js/language.js"></script>

</body>

</html>
